server.port=8080

# Database configs
spring.datasource.url=jdbc:mysql://localhost:3306/ecoCheckCMJD2026?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Isara1405
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configs?/ Hibernate

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Log Config

#Active log file
logging.file.name=C:/Users/Admin/Desktop/demo/Echocheck/application.log

# Rotate the log file when it reaches 10 MB
logging.logback.rollingpolicy.max-file-size=10MB

# Retain archived log files for 30 days
logging.logback.rollingpolicy.max-history=30

# Limit the total size of archived log files to 2 GB
logging.logback.rollingpolicy.total-size-cap=2GB

# Archive and compress old log files
logging.logback.rollingpolicy.file-name-pattern=D:/Thanura/app-logs-cmjd/application-%d{yyyy-MM-dd}.%i.log.gz

# Clean archived log history on application startup
logging.logback.rollingpolicy.clean-history-on-start=true


